# Netlify auto-detects Next.js and installs its runtime. Do not set `publish` or a plugin here.
# Security headers live in next.config.ts, because Netlify's toml headers do not reach pages
# rendered by the Next.js runtime.
[build]
  command = "npm run build"

# Static assets: long cache. Next hashes filenames.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
