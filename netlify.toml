# Netlify auto-detects Next.js and installs its runtime. Do not set `publish` or a plugin here.
[build]
  command = "npm run build"

# Static assets: long cache. Next hashes filenames.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
